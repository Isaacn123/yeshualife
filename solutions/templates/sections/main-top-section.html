{% load static %}

<section class="yl-solutions-hero py-0" id="karamojaHeader">
  <div class="yl-solutions-hero__media bg-holder overlay overlay-2">
    {# Instant visual while the compressed MP4 streams in #}
    <img
      class="yl-solutions-hero__poster"
      src="{% static 'images/bg-video-yeshualife-poster.jpg' %}"
      alt=""
      width="1280"
      height="720"
      decoding="async"
      fetchpriority="high"
    >
    <video
      class="yl-solutions-hero__video bg-video"
      muted
      playsinline
      loop
      preload="none"
      poster="{% static 'images/bg-video-yeshualife-poster.jpg' %}"
      data-src="{% static 'images/bg-video-yeshualife-web.mp4' %}"
      aria-hidden="true"
    ></video>
  </div>
  <div class="container">
    <div class="row min-vh-100 align-items-center py-8">
      <div class="col-lg-7">
        <h1 class="yl-solutions-hero__title fs-6 fs-sm-5 fs-xl-4 display-4 text-white fst-italic overflow-hidden text-decoration-underline">
          Lasting Solutions
        </h1>
        <div class="overflow-hidden">
          <p class="yl-solutions-hero__lead text-white mb-4 font-secondary fst-italic fs-7">
            Empowering Communities for Sustainable Food Security
          </p>
        </div>
        <div>
          <a class="btn btn-outline-light mt-4 yl-solutions-hero__cta" href="#YeshualifeAbout">Learn more</a>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
(function () {
  var hero = document.getElementById('karamojaHeader');
  if (!hero) return;
  var video = hero.querySelector('.yl-solutions-hero__video');
  if (!video || !video.dataset.src) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var started = false;
  function markReady() {
    video.classList.add('is-ready');
  }
  function tryPlay() {
    var p = video.play();
    if (p && typeof p.then === 'function') {
      p.then(markReady).catch(function () {});
    } else {
      markReady();
    }
  }
  function startVideo() {
    if (started) return;
    started = true;
    video.src = video.dataset.src;
    video.addEventListener('playing', markReady, { once: true });
    video.addEventListener('canplay', tryPlay, { once: true });
    video.load();
  }

  if ('requestIdleCallback' in window) {
    requestIdleCallback(startVideo, { timeout: 1600 });
  } else {
    window.setTimeout(startVideo, 350);
  }

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          startVideo();
          if (video.src && video.paused) tryPlay();
        } else if (video.src && !video.paused) {
          video.pause();
        }
      });
    }, { rootMargin: '80px 0px' });
    io.observe(hero);
  }
})();
</script>
