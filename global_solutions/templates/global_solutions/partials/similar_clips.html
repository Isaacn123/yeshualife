{% if similar_videos %}
<section class="fh-similar-clips">
  <h2 class="fh-section-title">More clips</h2>
  <div class="fh-similar-clips__list">
    {% for clip in similar_videos %}
      <article class="fh-similar-clip">
        {% if clip.title %}
          <h3 class="fh-similar-clip__title">{{ clip.title }}</h3>
        {% endif %}
        {% if clip.playback_url %}
          <div class="gs-video-player is-paused fh-similar-clip__player">
            <video
              class="gs-video-player-el"
              controls
              playsinline
              preload="metadata"
              {% if clip.playback_uses_hls %}
                data-playback-src="{{ clip.playback_url }}"
                data-playback-hls="true"
              {% else %}
                src="{{ clip.playback_url }}"
              {% endif %}
              {% if clip.thumbnail_url %}poster="{{ clip.thumbnail_url }}"{% endif %}
            ></video>
          </div>
        {% endif %}
      </article>
    {% endfor %}
  </div>
</section>
{% endif %}
