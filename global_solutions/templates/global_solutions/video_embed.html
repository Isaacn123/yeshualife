{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ video.title }}</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }
    .gs-embed-player {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .gs-embed-player video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="gs-embed-player">
    {% if video.playback_url %}
      {% include "global_solutions/partials/video_native.html" with v=video video_class="gs-embed-video" %}
    {% else %}
      <p style="color:#fff;padding:1rem;">Video is not ready for playback yet.</p>
    {% endif %}
  </div>
  {% if video.playback_uses_hls %}
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
    <script src="{% static 'global_solutions/global_solutions.js' %}"></script>
  {% endif %}
</body>
</html>
