# Include from the yeshualifeug.com server block (or http {}) so Wagtail image
# uploads are not rejected with HTTP 413 Request Entity Too Large.
#
# Example:
#   include /var/www/yeshualife/deploy/nginx-upload-limits.conf;
#
# Or set directly in the site config:
#   client_max_body_size 50m;
#
# Then: sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 50m;
