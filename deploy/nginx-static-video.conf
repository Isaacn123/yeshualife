# Faster progressive playback for hero / background MP4s under /static/.
#
# Production currently returns full 200 responses for Range requests on
# bg-video-*.mp4 (no Accept-Ranges / 206). That forces browsers to wait on
# most of the file before playback can start.
#
# Fix: serve /static/ with nginx directly (alias/root to STATIC_ROOT), not
# through gunicorn, and add the following inside your existing
# `location /static/` block:
#
#   gzip off;                 # do not gzip video
#   sendfile on;
#   tcp_nopush on;
#   # nginx enables byte-range for static files by default when sendfile works
#
# Then: sudo nginx -t && sudo systemctl reload nginx
#
# After deploy also run collectstatic so these files exist on the server:
#   images/bg-video-yeshualife-web.mp4
#   images/bg-video-yeshualife-poster.jpg
